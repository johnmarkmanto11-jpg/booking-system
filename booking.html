<!DOCTYPE html><html lang="en"><head><title>Book Your Stay | Rosemont Hills</title><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><link href='https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'><link rel='stylesheet' href='css/styles.css'></head><body>
<header class='nav'><a class='logo' href='index.html'><svg viewBox='0 0 90 48' width='84' height='46' fill='none' stroke='#0b5f7a' stroke-width='3' stroke-linecap='round' aria-hidden='true'><path d='M12 28 34 6l12 12 8-8 20 18'/><path d='M4 38c14-10 24 6 40-2s28-4 42-8'/><path d='M12 45c12-6 22 4 36-1s24-3 34-6'/></svg><span><b>Rosemont Hills</b><small>Resort &amp; Villas</small></span></a><nav><a class='on' href='index.html#top'>Home</a><a href='index.html#rooms'>Rooms</a><a href='index.html#about'>About</a><a href='index.html#contact'>Contact</a></nav><a class='btn' href='#booking' data-book>Book Now</a></header>
<section class='hero' id='top'><div class='inner'><h1>Book Your Stay</h1><p>Relax, unwind, and make unforgettable memories</p></div></section>
<main><section class="card" id="booking"><form id='bookingForm' action='/api/booking' method='POST' novalidate><div class='bk'>
<div class='col g'><h2><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' aria-hidden='true'><circle cx='12' cy='7' r='4'/><path d='M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7'/></svg> Guest Details</h2>
 <div class='field'><label for='name'>Full Name <i>*</i></label><input id='name' name='name' type='text' autocomplete='name' placeholder='Enter your full name'><small class='err' id='e-name'></small></div>
 <div class='field'><label for='email'>Email Address <i>*</i></label><input id='email' name='email' type='email' autocomplete='email' placeholder='you@example.com'><small class='err' id='e-email'></small></div>
 <div class='field'><label for='phone'>Phone Number <i>*</i></label><input id='phone' name='phone' type='tel' autocomplete='tel' placeholder='+63 912 345 6789'><small class='err' id='e-phone'></small></div>
 <div class='field'><label for='notes'>Special Requests / Notes</label><textarea id='notes' name='notes' rows='3' placeholder='Optional'></textarea></div></div>
<div class='col r'><h2><svg class='ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' aria-hidden='true'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/></svg> Reservation Details</h2>
 <div class='field'><label for='checkin'>Check-In Date <i>*</i></label><input id='checkin' name='checkin' type='date'><small class='err' id='e-checkin'></small></div>
 <div class='field'><label for='checkout'>Check-Out Date <i>*</i></label><input id='checkout' name='checkout' type='date'><small class='err' id='e-checkout'></small></div>
 <div class='field'><label for='room'>Room Type <i>*</i></label><select id='room' name='room'><option value=''>Select a room</option><option>Deluxe Suite</option><option>Ocean View Villa</option><option>Standard Room</option><option>Family Suite</option></select><small class='err' id='e-room'></small></div>
 <div class='two'><div class='field'><label for='adults'>Adults</label><select id='adults' name='adults'><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
 <div class='field'><label for='children'>Children</label><select id='children' name='children'><option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div></div>
<div class='photo' role='img' aria-label='Resort pool facing the ocean'></div>
<button type='submit' class='btn submit'>Check Availability</button></div></form></section></main>
<dialog id='done'><h3>Request received</h3><p id='doneMsg'></p><button class='btn' id='closeDone'>Close</button></dialog><script src="js/main.js"></script></body></html>
